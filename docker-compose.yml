services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: heyintent_rack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - heyintent-rack-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heyintent_rack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  heyintent-rack-postgres-data:
